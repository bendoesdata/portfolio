<script>
	const grid = document.getElementById('work-grid');

	data.forEach(d => {
		const tagsHtml = (d.tags || []).map(tag =>
			`<span class="project-tag">${tag}</span>`
		).join('');

		const row = document.createElement('div');
		row.classList.add('project-row');
		row.innerHTML = `
			<div class="project-col-title">
				<a href="${d.url}"><h3>${d.title}</h3></a>
				${d.date ? `<span class="project-date">${d.date}</span>` : ''}
			</div>
			<div class="project-col-desc">
				<p>${d.summary}</p>
			</div>
			<div class="project-col-tags">
				${tagsHtml}
				<br>
				
				<div style="margin-top: 30px; font-size: 14px; color: rgba(60, 60, 60, 0.8);">
					<span style="color: rgba(60, 60, 60, 0.6);">In partnership with:</span>
					<br><span style="margin-top: 4px; display: block">${d.client}</span>
				</div>
			</div>
			<div class="project-col-image">
				<a href="${d.url}">
					<img src="${d.imgUrl}" alt="${d.description}" loading="lazy" />
				</a>
			</div>
		`;
		grid.appendChild(row);
	});

	Promise.all([
		d3.csv("./data/past-articles.csv"),
		d3.csv("./data/article-highlights.csv")
	]).then((datasets) => {
		//   console.log(datasets[0])
		//   console.log(datasets[1])
		let articles = []
		datasets[0].reverse().forEach((d, i) => {
			let obj = {}

			obj.date = Object.values(d)[0];
			obj.title = Object.values(d)[1];
			obj.description = Object.values(d)[2];
			obj.link = Object.values(d)[3];
			articles.push(obj)

			if (i < 5) {

				d3.select('#articles .container')
					.append('div')
					.html(
						'<a target="_blank" href="' + Object.values(d)[3] + '"><h4 style="margin-top: 10px">' + Object.values(d)[1] + '</h4></a>' +
						'<span style="font-size: 14px; font-style: italic;">Read on ' + Object.values(d)[0] + '</span>'
					)
			}
		})

		let highlights = []
		datasets[1].forEach(d => {
			let obj = {}

			obj.date = Object.values(d)[0];
			obj.title = Object.values(d)[1];
			obj.description = Object.values(d)[2];
			obj.link = Object.values(d)[3];
			highlights.push(obj)
		})
		console.log(articles, highlights)
	});


</script>
